<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>Faction War Payout Calculator</title>
  <style>
    :root {
      --bg: #0f131a;
      --card: #181e29;
      --border: #2a3344;
      --text: #e6ecf5;
      --muted: #8b9bb4;
      --accent: #3b82f6;
      --green: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: 20px; background: var(--bg); color: var(--text); }
    .container { max-width: 1240px; margin: 0 auto; }
    h1 { margin: 0 0 16px; font-size: 1.5rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
    }
    label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
    input, select, button {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0d1117;
      color: var(--text);
      font-size: 0.9rem;
    }
    button {
      background: var(--accent);
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { opacity: 0.92; }
    button.secondary { background: #263042; }
    button.green { background: var(--green); color: #062419; }
    details {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    summary {
      cursor: pointer;
      font-size: 0.82rem;
      color: var(--muted);
      user-select: none;
    }
    summary:hover { color: var(--text); }
    .summary-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .stat-box { background: #111620; padding: 10px; border-radius: 8px; }
    .stat-box span { display: block; font-size: 0.75rem; color: var(--muted); }
    .stat-box strong { font-size: 1.05rem; color: var(--green); }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.88rem; }
    th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: right; }
    th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
    th {
      color: var(--muted);
      font-weight: 600;
      background: #131822;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    th:hover { color: var(--text); background: #19202e; }
    .sort-arrow { font-size: 0.72rem; margin-left: 4px; opacity: 0.75; }
    th.sorted { color: var(--text); }
    tr:hover { background: #1e2533; }
    input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
    .status { font-size: 0.84rem; color: var(--amber); margin-top: 10px; line-height: 1.4; }
    .status.ok { color: var(--green); }
    .status.err { color: var(--red); }
  </style>
</head>
<body>
<div class="container">
  <h1>Faction War Payout Calculator</h1>

  <!-- 1. API & War Selection -->
  <div class="card">
    <div class="grid">
      <div>
        <label for="apiKey">Torn API Key (Limited + Faction AA)</label>
        <input type="password" id="apiKey" name="apiKey" placeholder="Enter Torn API Key" />
      </div>
      <div>
        <label for="rankedWarSelect">Ranked War (From Torn)</label>
        <select id="rankedWarSelect" name="rankedWarSelect" onchange="selectRankedWar(this.value)">
          <option value="">-- Sync to load Ranked Wars --</option>
        </select>
      </div>
      <div>
        <label for="savedWarSelect">Saved War (From Firebase)</label>
        <select id="savedWarSelect" name="savedWarSelect" onchange="loadSavedWar(this.value)">
          <option value="">-- Select Saved War --</option>
        </select>
      </div>
    </div>

    <div style="display:flex; flex-wrap:wrap; gap:10px; margin-top:12px;">
      <button type="button" style="width:auto;" onclick="syncTornData()">Sync War &amp; Attacks from Torn</button>
      <button type="button" class="secondary" style="width:auto;" onclick="refreshSavedWarsList()">Refresh Saved Wars</button>
    </div>

    <details>
      <summary>Advanced / Manual Time Window &amp; Faction IDs</summary>
      <div class="grid" style="margin-top:10px;">
        <div>
          <label for="warStart">War Start (UNIX)</label>
          <input type="number" id="warStart" name="warStart" placeholder="Auto-filled" oninput="recalculate()" />
        </div>
        <div>
          <label for="warEnd">War End (UNIX)</label>
          <input type="number" id="warEnd" name="warEnd" placeholder="Auto-filled" oninput="recalculate()" />
        </div>
        <div>
          <label for="myFactionId">Your Faction ID</label>
          <input type="number" id="myFactionId" name="myFactionId" placeholder="Auto-filled" oninput="recalculate()" />
        </div>
        <div>
          <label for="enemyFactionId">Enemy Faction ID</label>
          <input type="number" id="enemyFactionId" name="enemyFactionId" placeholder="Auto-filled" oninput="recalculate()" />
        </div>
      </div>
    </details>

    <div id="status" class="status">Ready. Enter your Torn API key and click Sync War &amp; Attacks from Torn.</div>
  </div>

  <!-- 2. Payout Settings -->
  <div class="card">
    <div class="grid">
      <div>
        <label for="sellAmount">Cache Gross Sell Amount ($)</label>
        <input type="number" id="sellAmount" name="sellAmount" value="500000000" oninput="recalculate()" />
      </div>
      <div>
        <label for="sellTaxPct">Sell Tax (%)</label>
        <input type="number" id="sellTaxPct" name="sellTaxPct" value="5" step="0.1" oninput="recalculate()" />
      </div>
      <div>
        <label for="factionCutPct">Faction Cut (%)</label>
        <input type="number" id="factionCutPct" name="factionCutPct" value="10" step="0.1" oninput="recalculate()" />
      </div>
      <div>
        <label for="salariedPct">Salaried Pool (%)</label>
        <input type="number" id="salariedPct" name="salariedPct" value="15" step="0.1" oninput="recalculate()" />
      </div>
      <div>
        <label for="outsideHitRespect">Non-War Chain Hit Respect</label>
        <input type="number" id="outsideHitRespect" name="outsideHitRespect" value="2.5" step="0.1" oninput="recalculate()" />
      </div>
      <div>
        <label for="salariedEarnHits">Salaried Also Earn Hit Pay?</label>
        <select id="salariedEarnHits" name="salariedEarnHits" onchange="recalculate()">
          <option value="yes">Yes (Salary + Hits)</option>
          <option value="no">No (Salary Only)</option>
        </select>
      </div>
    </div>

    <div class="summary-bar">
      <div class="stat-box"><span>Net After Tax</span><strong id="netAfterTax">$0</strong></div>
      <div class="stat-box"><span>Faction Cut ($)</span><strong id="factionCutAmt">$0</strong></div>
      <div class="stat-box"><span>Salaried Pool ($)</span><strong id="salariedPoolAmt">$0</strong></div>
      <div class="stat-box"><span>Hit/Respect Pool ($)</span><strong id="hitPoolAmt">$0</strong></div>
      <div class="stat-box"><span>Total Weighted Respect</span><strong id="totalRespect">0.00</strong></div>
    </div>
  </div>

  <!-- 3. Member Payout Table -->
  <div class="card">
    <div style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px;">
      <strong>Member Breakdown</strong>
      <div style="display:flex; gap:8px; width:auto;">
        <button type="button" class="secondary" style="width:auto;" onclick="saveWarToFirebase()">Save War to DB</button>
        <button type="button" class="green" style="width:auto;" onclick="copyPayoutList()">Copy Payout List</button>
      </div>
    </div>
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr id="memberTableHeadRow"></tr>
        </thead>
        <tbody id="memberTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyC1B6-tReQgkuST7sQW0erUZMpWCQTEhFE",
    authDomain: "razersalliancewarpayout.firebaseapp.com",
    databaseURL: "https://razersalliancewarpayout-default-rtdb.firebaseio.com",
    projectId: "razersalliancewarpayout",
    storageBucket: "razersalliancewarpayout.firebasestorage.app",
    messagingSenderId: "1048074179524",
    appId: "1:1048074179524:web:d2357307b32a8159a08a91"
  };

  let db = null;
  if (typeof firebase !== "undefined" && firebase.apps) {
    try {
      const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(firebaseConfig);
      db = app.database();
    } catch (err) {
      console.error("Firebase init error:", err);
    }
  }

  let membersMap = {};
  let attacksMap = {};
  let rankedWarsCache = {};
  let latestRows = [];
  let sortKey = "totalPay";
  let sortDir = "desc";

  const COLUMNS = [
    { key: "salaried", label: "Salaried", defaultDir: "desc", type: "bool" },
    { key: "name", label: "Member", defaultDir: "asc", type: "string" },
    { key: "warHits", label: "War Hits", defaultDir: "desc", type: "num" },
    { key: "warRespect", label: "War Respect", defaultDir: "desc", type: "num" },
    { key: "chainOutsideHits", label: "10+ Chain Outside Hits", defaultDir: "desc", type: "num" },
    { key: "ignoredOutsideHits", label: "Ignored Outside (<10)", defaultDir: "desc", type: "num" },
    { key: "weightedRespect", label: "Total Weighted Respect", defaultDir: "desc", type: "num" },
    { key: "salaryPay", label: "Salary Pay", defaultDir: "desc", type: "num" },
    { key: "hitPay", label: "Hit Pay", defaultDir: "desc", type: "num" },
    { key: "totalPay", label: "Total Payout", defaultDir: "desc", type: "num" }
  ];

  const WIN_RESULTS = new Set(["Attacked", "Mugged", "Hospitalized"]);

  function escapeHtml(str) {
    return String(str ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function formatTctDate(unixSec) {
    if (!unixSec) return "Unknown";
    return new Date(unixSec * 1000).toLocaleDateString("en-US", {
      month: "short",
      day: "numeric",
      year: "numeric",
      timeZone: "UTC"
    }) + " TCT";
  }

  function renderTableHeaders() {
    const headRow = document.getElementById("memberTableHeadRow");
    headRow.innerHTML = COLUMNS.map(col => {
      const isSorted = sortKey === col.key;
      const arrow = isSorted ? (sortDir === "asc" ? "▲" : "▼") : "⇅";
      return `<th class="${isSorted ? "sorted" : ""}" onclick="setSortColumn('${col.key}')">${escapeHtml(col.label)}<span class="sort-arrow">${arrow}</span></th>`;
    }).join("");
  }

  function setSortColumn(key) {
    const col = COLUMNS.find(c => c.key === key);
    if (sortKey === key) {
      sortDir = sortDir === "asc" ? "desc" : "asc";
    } else {
      sortKey = key;
      sortDir = col?.defaultDir || "desc";
    }
    sortLatestRows();
    renderTableHeaders();
    renderTable();
  }

  function compareRows(a, b) {
    const col = COLUMNS.find(c => c.key === sortKey) || { type: "num" };
    const mult = sortDir === "asc" ? 1 : -1;
    let cmp = 0;

    if (col.type === "bool") {
      cmp = (a.salaried ? 1 : 0) - (b.salaried ? 1 : 0);
    } else if (col.type === "string") {
      cmp = String(a.name || "").localeCompare(String(b.name || ""), undefined, { sensitivity: "base" });
    } else {
      cmp = (Number(a[sortKey]) || 0) - (Number(b[sortKey]) || 0);
    }

    if (cmp !== 0) return cmp * mult;
    return String(a.name || "").localeCompare(String(b.name || ""), undefined, { sensitivity: "base" });
  }

  function sortLatestRows() {
    latestRows.sort(compareRows);
  }

  async function refreshSavedWarsList() {
    if (!db) return;
    try {
      const snap = await db.ref("wars").once("value");
      const warsObj = snap.val() || {};
      const select = document.getElementById("savedWarSelect");
      const currentVal = select.value;

      select.innerHTML = `<option value="">-- Select Saved War (${Object.keys(warsObj).length}) --</option>`;
      const keys = Object.keys(warsObj).sort((a, b) => Number(b) - Number(a));
      for (const key of keys) {
        const w = warsObj[key] || {};
        const cfg = w.payoutConfig || {};
        const atkCount = w.attacks ? Object.keys(w.attacks).length : 0;
        const dateLabel = formatTctDate(Number(key));
        const label = cfg.enemyName
          ? `${dateLabel} vs ${cfg.enemyName} (${atkCount} hits)`
          : `${dateLabel} (${atkCount} hits)`;
        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = label;
        select.appendChild(opt);
      }

      if (currentVal && warsObj[currentVal]) select.value = currentVal;
    } catch (err) {
      setStatus(`Failed to read saved wars: ${err.message}`, "err");
    }
  }

  async function loadSavedWar(warKey) {
    if (!db || !warKey) return;
    try {
      const snap = await db.ref(`wars/${warKey}`).once("value");
      const warData = snap.val();
      if (!warData) return setStatus(`No data found for war ${warKey}.`, "err");

      const cfg = warData.payoutConfig || {};
      if (cfg.warStart !== undefined) document.getElementById("warStart").value = cfg.warStart;
      if (cfg.warEnd !== undefined) document.getElementById("warEnd").value = cfg.warEnd;
      if (cfg.myFactionId !== undefined) document.getElementById("myFactionId").value = cfg.myFactionId;
      if (cfg.enemyFactionId !== undefined) document.getElementById("enemyFactionId").value = cfg.enemyFactionId;
      if (cfg.sellAmount !== undefined) document.getElementById("sellAmount").value = cfg.sellAmount;
      if (cfg.sellTaxPct !== undefined) document.getElementById("sellTaxPct").value = cfg.sellTaxPct;
      if (cfg.factionCutPct !== undefined) document.getElementById("factionCutPct").value = cfg.factionCutPct;
      if (cfg.salariedPct !== undefined) document.getElementById("salariedPct").value = cfg.salariedPct;
      if (cfg.outsideHitRespect !== undefined) document.getElementById("outsideHitRespect").value = cfg.outsideHitRespect;
      if (cfg.salariedEarnHits !== undefined) document.getElementById("salariedEarnHits").value = cfg.salariedEarnHits;

      if (warData.members) membersMap = warData.members;
      attacksMap = warData.attacks || {};
      recalculate();
      setStatus(`Loaded saved war (${formatTctDate(Number(warKey))}, ${Object.keys(attacksMap).length} attacks).`, "ok");
    } catch (err) {
      setStatus(`Error loading saved war: ${err.message}`, "err");
    }
  }

  function applyRankedWarSelection(warId, myFactionId) {
    const entry = rankedWarsCache[warId];
    if (!entry) return;
    const wInfo = entry.war || entry;
    const nowSec = Math.floor(Date.now() / 1000);
    const startTs = Number(wInfo.start || 0);
    const rawEnd = Number(wInfo.end || 0);
    const endTs = rawEnd > 0 ? rawEnd : Math.max(nowSec, startTs);

    document.getElementById("warStart").value = startTs;
    document.getElementById("warEnd").value = endTs;

    if (entry.factions) {
      const enemyId = Object.keys(entry.factions).find(fid => Number(fid) !== Number(myFactionId));
      if (enemyId) document.getElementById("enemyFactionId").value = enemyId;
    }
  }

  async function selectRankedWar(warId) {
    if (!warId) return;
    const myFactionId = Number(document.getElementById("myFactionId").value) || 0;
    applyRankedWarSelection(warId, myFactionId);
    await syncTornData(true);
  }

  async function syncTornData(keepSelectedWar = false) {
    const key = document.getElementById("apiKey").value.trim();
    if (!key) return setStatus("Please enter a Torn API key first.", "err");

    setStatus("Fetching faction roster and ranked wars from Torn...");
    try {
      const baseRes = await fetch(`https://api.torn.com/faction/?selections=basic,rankedwars&key=${encodeURIComponent(key)}`);
      const baseData = await baseRes.json();
      if (baseData.error) {
        return setStatus(`Torn API Error (${baseData.error.code}): ${baseData.error.error}`, "err");
      }

      const detectedFactionId = Number(baseData.ID || baseData.id || 0);
      if (detectedFactionId) document.getElementById("myFactionId").value = detectedFactionId;

      const nextMembers = {};
      for (const [id, info] of Object.entries(baseData.members || {})) {
        nextMembers[String(id)] = {
          id: String(id),
          name: info.name || `Member ${id}`,
          salaried: Boolean(membersMap[String(id)]?.salaried)
        };
      }
      membersMap = { ...membersMap, ...nextMembers };

      rankedWarsCache = baseData.rankedwars || {};
      const warSelect = document.getElementById("rankedWarSelect");
      const prevWarId = warSelect.value;
      const sortedEntries = Object.entries(rankedWarsCache).sort((a, b) => {
        const startA = Number((a[1].war || a[1]).start || 0);
        const startB = Number((b[1].war || b[1]).start || 0);
        return startB - startA;
      });

      warSelect.innerHTML = `<option value="">-- Select Ranked War (${sortedEntries.length}) --</option>`;
      const nowSec = Math.floor(Date.now() / 1000);

      for (const [warId, entry] of sortedEntries) {
        const wInfo = entry.war || entry;
        const startTs = Number(wInfo.start || 0);
        const endTs = Number(wInfo.end || 0);
        const enemyId = entry.factions
          ? Object.keys(entry.factions).find(fid => Number(fid) !== detectedFactionId)
          : "";
        const enemyName = enemyId && entry.factions[enemyId]?.name
          ? entry.factions[enemyId].name
          : `Faction [${enemyId || "?"}]`;

        let statusTag = "Completed";
        if (startTs > nowSec) statusTag = "Upcoming";
        else if (!endTs || endTs === 0) statusTag = "Active";

        const opt = document.createElement("option");
        opt.value = warId;
        opt.textContent = `${formatTctDate(startTs)} vs ${enemyName} (${statusTag})`;
        warSelect.appendChild(opt);
      }

      if (keepSelectedWar && prevWarId && rankedWarsCache[prevWarId]) {
        warSelect.value = prevWarId;
      } else if (sortedEntries.length > 0) {
        const startedWar = sortedEntries.find(([, entry]) => Number((entry.war || entry).start || 0) <= nowSec);
        const chosenId = (startedWar || sortedEntries[0])[0];
        warSelect.value = chosenId;
        applyRankedWarSelection(chosenId, detectedFactionId);
      }

      const fromTs = Number(document.getElementById("warStart").value) || (nowSec - 86400);
      const toTs = Math.max(Number(document.getElementById("warEnd").value) || nowSec, fromTs);

      if (fromTs > nowSec) {
        attacksMap = {};
        recalculate();
        return setStatus(
          `Synced ${Object.keys(membersMap).length} members. Selected war hasn't started yet (${formatTctDate(fromTs)})—pick a completed war in the dropdown to load hits.`,
          "ok"
        );
      }

      // Torn v1 attacks returns up to 100 attacks starting from `from` moving forward.
      // Advance `cursorFrom = newestTs + 1` to walk through the entire war window.
      let cursorFrom = fromTs;
      let pagesFetched = 0;
      const maxPages = 30;
      const incomingAttacks = {};

      for (let page = 0; page < maxPages; page++) {
        if (cursorFrom > toTs) break;
        setStatus(`Fetching attacks for ${formatTctDate(fromTs)} (page ${page + 1}, ${Object.keys(incomingAttacks).length} loaded)...`);

        const atkRes = await fetch(
          `https://api.torn.com/faction/?selections=attacks&from=${cursorFrom}&to=${toTs}&key=${encodeURIComponent(key)}`
        );
        const atkData = await atkRes.json();
        if (atkData.error) {
          recalculate();
          return setStatus(`Torn API Error (${atkData.error.code}): ${atkData.error.error}`, "err");
        }

        const batch = atkData.attacks || {};
        const entries = Object.entries(batch);
        pagesFetched += 1;
        if (entries.length === 0) break;

        let newInBatch = 0;
        let newestTs = 0;
        for (const [atkId, a] of entries) {
          if (!incomingAttacks[atkId]) newInBatch += 1;
          incomingAttacks[atkId] = a;
          const t = Number(a.timestamp_ended || a.timestamp_started || 0);
          if (t > newestTs) newestTs = t;
        }

        if (entries.length < 100 || newInBatch === 0 || newestTs <= cursorFrom || newestTs >= toTs) {
          break;
        }
        cursorFrom = newestTs + 1;
      }

      attacksMap = incomingAttacks;

      if (db && fromTs) {
        if (Object.keys(incomingAttacks).length > 0) {
          await db.ref(`wars/${fromTs}/attacks`).update(incomingAttacks);
        }
        const snap = await db.ref(`wars/${fromTs}/attacks`).once("value");
        if (snap.exists()) attacksMap = snap.val();
        await refreshSavedWarsList();
        document.getElementById("savedWarSelect").value = String(fromTs);
      }

      const allAtks = Object.values(attacksMap);
      const myHitsCount = allAtks.filter(a => Number(a.attacker_faction) === detectedFactionId).length;
      const enemyId = Number(document.getElementById("enemyFactionId").value) || 0;
      const warWinsCount = allAtks.filter(
        a => Number(a.attacker_faction) === detectedFactionId &&
             Number(a.defender_faction) === enemyId &&
             WIN_RESULTS.has(a.result)
      ).length;

      recalculate();
      setStatus(
        `Synced ${Object.keys(membersMap).length} members & ${allAtks.length} total attacks (${pagesFetched} page(s)) — ${myHitsCount} outgoing by [${detectedFactionId}], ${warWinsCount} war wins vs [${enemyId}].`,
        "ok"
      );
    } catch (err) {
      setStatus(`Error while syncing: ${err.message}`, "err");
    }
  }

  function classifyHits() {
    const startTs = Number(document.getElementById("warStart").value) || 0;
    const endTs = Number(document.getElementById("warEnd").value) || Infinity;
    const myFactionId = Number(document.getElementById("myFactionId").value) || 0;
    const enemyId = Number(document.getElementById("enemyFactionId").value) || 0;

    const validWins = Object.values(attacksMap)
      .filter(a => {
        if (!a) return false;
        const matchesFaction = myFactionId ? Number(a.attacker_faction) === myFactionId : true;
        const endTime = Number(a.timestamp_ended || a.timestamp_started || 0);
        return matchesFaction && WIN_RESULTS.has(a.result) && endTime >= startTs && endTime <= endTs;
      })
      .sort((a, b) => Number(a.timestamp_ended || 0) - Number(b.timestamp_ended || 0));

    const runs = [];
    let currentRun = [];

    for (const atk of validWins) {
      const t = Number(atk.timestamp_ended || atk.timestamp_started || 0);
      if (currentRun.length === 0) {
        currentRun.push({ ...atk, _t: t });
      } else {
        const prevT = currentRun[currentRun.length - 1]._t;
        if (t - prevT <= 300) {
          currentRun.push({ ...atk, _t: t });
        } else {
          runs.push(currentRun);
          currentRun = [{ ...atk, _t: t }];
        }
      }
    }
    if (currentRun.length > 0) runs.push(currentRun);

    const stats = {};
    for (const id of Object.keys(membersMap)) {
      stats[id] = { warHits: 0, warRespect: 0, chainOutsideHits: 0, ignoredOutsideHits: 0 };
    }

    for (const run of runs) {
      const isChain = run.length >= 10;
      for (const atk of run) {
        const uid = String(atk.attacker_id);
        if (!stats[uid]) {
          membersMap[uid] = { id: uid, name: atk.attacker_name || `ID ${uid}`, salaried: false };
          stats[uid] = { warHits: 0, warRespect: 0, chainOutsideHits: 0, ignoredOutsideHits: 0 };
        }

        const isWarTarget = enemyId && Number(atk.defender_faction) === enemyId;
        if (isWarTarget) {
          stats[uid].warHits += 1;
          stats[uid].warRespect += Number(atk.respect ?? atk.respect_gain ?? 0);
        } else if (isChain) {
          stats[uid].chainOutsideHits += 1;
        } else {
          stats[uid].ignoredOutsideHits += 1;
        }
      }
    }

    return stats;
  }

  function recalculate() {
    const sellAmount = Math.max(0, Number(document.getElementById("sellAmount").value) || 0);
    const sellTaxPct = Math.max(0, Number(document.getElementById("sellTaxPct").value) || 0);
    const factionCutPct = Math.max(0, Number(document.getElementById("factionCutPct").value) || 0);
    const salariedPct = Math.max(0, Number(document.getElementById("salariedPct").value) || 0);
    const outsideHitRespect = Math.max(0, Number(document.getElementById("outsideHitRespect").value) || 0);
    const salariedEarnHits = document.getElementById("salariedEarnHits").value === "yes";

    const netAfterTax = sellAmount * (1 - sellTaxPct / 100);
    const baseFactionCut = netAfterTax * (factionCutPct / 100);
    const distributable = netAfterTax - baseFactionCut;

    const salariedMembers = Object.values(membersMap).filter(m => m.salaried);
    const salariedPool = salariedMembers.length > 0 ? distributable * (salariedPct / 100) : 0;
    const hitPool = distributable - salariedPool;

    const hitStats = classifyHits();

    let totalWeightedRespect = 0;
    const rows = Object.values(membersMap).map(m => {
      const s = hitStats[m.id] || { warHits: 0, warRespect: 0, chainOutsideHits: 0, ignoredOutsideHits: 0 };
      const rawWeightedRespect = s.warRespect + (s.chainOutsideHits * outsideHitRespect);
      const eligibleRespect = (!m.salaried || salariedEarnHits) ? rawWeightedRespect : 0;
      totalWeightedRespect += eligibleRespect;
      return { ...m, ...s, weightedRespect: rawWeightedRespect, eligibleRespect };
    });

    const salaryPerPerson = salariedMembers.length > 0 ? Math.floor(salariedPool / salariedMembers.length) : 0;

    let totalDistributed = 0;
    latestRows = rows.map(r => {
      const salaryPay = r.salaried ? salaryPerPerson : 0;
      const hitPay = totalWeightedRespect > 0
        ? Math.floor(hitPool * (r.eligibleRespect / totalWeightedRespect))
        : 0;
      const totalPay = salaryPay + hitPay;
      totalDistributed += totalPay;
      return { ...r, salaryPay, hitPay, totalPay };
    });

    sortLatestRows();

    const finalFactionCut = Math.max(0, Math.floor(netAfterTax - totalDistributed));

    document.getElementById("netAfterTax").textContent = formatMoney(Math.floor(netAfterTax));
    document.getElementById("factionCutAmt").textContent = formatMoney(finalFactionCut);
    document.getElementById("salariedPoolAmt").textContent = formatMoney(salaryPerPerson * salariedMembers.length);
    document.getElementById("hitPoolAmt").textContent = formatMoney(Math.floor(hitPool));
    document.getElementById("totalRespect").textContent = totalWeightedRespect.toFixed(2);

    renderTableHeaders();
    renderTable();
  }

  function renderTable() {
    const tbody = document.getElementById("memberTableBody");
    if (latestRows.length === 0) {
      tbody.innerHTML = `<tr><td colspan="10" style="text-align:center; color:var(--muted); padding:16px;">No members loaded yet. Sync from Torn or select a saved war.</td></tr>`;
      return;
    }

    tbody.innerHTML = latestRows.map(r => `
      <tr>
        <td><input type="checkbox" name="salaried_${escapeHtml(r.id)}" ${r.salaried ? "checked" : ""} onchange="toggleSalaried('${escapeHtml(r.id)}', this.checked)" /></td>
        <td>${escapeHtml(r.name)} [${escapeHtml(r.id)}]</td>
        <td>${r.warHits}</td>
        <td>${r.warRespect.toFixed(2)}</td>
        <td>${r.chainOutsideHits}</td>
        <td style="color: var(--muted)">${r.ignoredOutsideHits}</td>
        <td><strong>${r.weightedRespect.toFixed(2)}</strong></td>
        <td>${formatMoney(r.salaryPay)}</td>
        <td>${formatMoney(r.hitPay)}</td>
        <td style="color: var(--green); font-weight: 700;">${formatMoney(r.totalPay)}</td>
      </tr>
    `).join("");
  }

  function toggleSalaried(id, checked) {
    if (membersMap[id]) {
      membersMap[id].salaried = checked;
      recalculate();
    }
  }

  async function saveWarToFirebase() {
    if (!db) return setStatus("Firebase DB is not connected.", "err");
    const warKey = document.getElementById("warStart").value.trim() || "manual";
    const warSelect = document.getElementById("rankedWarSelect");
    const selectedLabel = warSelect.options[warSelect.selectedIndex]?.textContent || "";
    const vsMatch = selectedLabel.match(/vs\s+(.+?)\s+\(/);

    try {
      await db.ref(`wars/${warKey}`).update({
        members: membersMap,
        payoutConfig: {
          warStart: Number(document.getElementById("warStart").value) || 0,
          warEnd: Number(document.getElementById("warEnd").value) || 0,
          myFactionId: Number(document.getElementById("myFactionId").value) || 0,
          enemyFactionId: Number(document.getElementById("enemyFactionId").value) || 0,
          enemyName: vsMatch ? vsMatch[1] : "",
          sellAmount: Number(document.getElementById("sellAmount").value) || 0,
          sellTaxPct: Number(document.getElementById("sellTaxPct").value) || 0,
          factionCutPct: Number(document.getElementById("factionCutPct").value) || 0,
          salariedPct: Number(document.getElementById("salariedPct").value) || 0,
          outsideHitRespect: Number(document.getElementById("outsideHitRespect").value) || 0,
          salariedEarnHits: document.getElementById("salariedEarnHits").value,
          salariedIds: Object.values(membersMap).filter(m => m.salaried).map(m => m.id),
          savedAt: Date.now()
        }
      });
      await refreshSavedWarsList();
      document.getElementById("savedWarSelect").value = warKey;
      setStatus("Saved war roster, salaried flags, and payout settings to Firebase.", "ok");
    } catch (err) {
      setStatus(`Failed to save war: ${err.message}`, "err");
    }
  }

  function copyPayoutList() {
    const lines = latestRows
      .filter(r => r.totalPay > 0)
      .map(r => `${r.name} [${r.id}] - ${formatMoney(r.totalPay)}`);
    if (lines.length === 0) return setStatus("No payouts above $0 to copy.", "err");
    navigator.clipboard.writeText(lines.join("\n"));
    setStatus(`Copied ${lines.length} member payouts to clipboard.`, "ok");
  }

  function formatMoney(n) {
    return "$" + Number(n || 0).toLocaleString("en-US");
  }

  function setStatus(msg, type = "") {
    const el = document.getElementById("status");
    if (!el) return;
    el.textContent = msg;
    el.className = "status" + (type ? ` ${type}` : "");
  }

  renderTableHeaders();
  recalculate();
  if (db) {
    refreshSavedWarsList().then(() => {
      setStatus("Connected to RazersAllianceWarPayout DB. Enter your Torn API key and click Sync.", "ok");
    });
  } else {
    setStatus("Running in local/Torn mode (Firebase SDK unavailable—check browser console).", "err");
  }
</script>
</body>
